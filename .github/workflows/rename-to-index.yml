name: Rename EP02 file to index.html
on:
  push:
    paths:
      - .github/workflows/rename-to-index.yml
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename files
        run: |
          git config user.name "kp20240001-netizen"
          git config user.email "kp20240001-netizen@users.noreply.github.com"
          git mv index.html index-ep01.html
          git mv gta6-10tai-yin-cang-shen-che-quan-di-tu-lan-ren-bao.html index.html
          git commit -m "將 EP02 新版設為 index.html，舊版備份為 index-ep01.html"
          git push
